<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./java.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="labels">
        <h2 class="human">Human</h2>
        <h2 class="comp">Comp</h2>
      </div>
      <div class="score">
        <p class="humanscore">0</p>
        <p>-</p>
        <p class="compscore">0</p>
      </div>
      <div class="dir1">
        <div class="dir2">
          <p class="directions">Pick Your Choice!</p>
        </div>
      </div>
      <div class="com1">
        <div class="com2">
          <div class="computer">Comp Picked:</div>
        </div>
      </div>
      <p class="current"></p>
      <div class="options">
        <button class="opt1">Rock</button>
        <button class="opt2">Paper</button>
        <button class="opt3">Scissors</button>
      </div>
      <button class="gamestart">Shoot!</button>
    </div>
  </body>
</html>
